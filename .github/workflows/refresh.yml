name: refresh

# once a day, after gasweek's snapshot: rewrite the live block of the profile readme
# from the public dataset and the site feed. standard library only, no keys.

on:
  schedule:
    - cron: "41 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python refresh_readme.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "readme: refresh $(date -u +%F)"
          git push
